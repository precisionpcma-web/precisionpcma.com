<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Your build sheet | Precision PC</title>
<meta name="description" content="Your personal Precision PC build sheet with every part, its price and live price links." />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0a;--surface:#141414;--field:#1c1c1c;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.18);--text:#f0ede8;--text-2:#b4b1ac;--text-3:#86837e;--orange:#ff5818;
--head:'Plus Jakarta Sans','Inter',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--brand:'Syne','Plus Jakarta Sans',sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);text-wrap:balance}
p{color:var(--text-2)}
a{color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:4px}
.wrap{max-width:960px;margin:0 auto;padding-inline:24px}
header{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--orange),rgba(255,88,24,0) 40%) 1}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:36px;height:36px;display:block}
.wordmark{font-family:var(--brand);font-size:1rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.wordmark span{font-weight:500;color:var(--text-3)}
.nav-note{font-size:14px;color:var(--text-3)}
main{padding-block:48px 72px}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 32px;margin-bottom:32px}
.sheet-head h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.meta{font-size:14px;color:var(--text-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--body);border-radius:8px;padding:12px 20px;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--text);color:#0a0a0a}
.btn-primary:hover{background:var(--orange)}
.btn-quiet{border-color:var(--line-strong);color:var(--text);background:transparent}
.btn-quiet:hover{border-color:var(--orange)}
.parts{border-top:1px solid var(--line-strong)}
.part{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 24px;align-items:baseline;padding-block:16px;border-bottom:1px solid var(--line)}
.part-type{font-size:14px;font-weight:600;color:var(--text-3)}
.part-name{font-weight:600;color:var(--text)}
.part-sub{grid-column:2;font-size:14px;color:var(--text-3)}
.part-sub a{color:var(--text-2)}
.part-sub a:hover{color:var(--orange)}
.part-price{font-family:var(--head);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.totals{margin-top:24px;margin-left:auto;max-width:420px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:24px;padding-block:6px;color:var(--text-2)}
.totals .grand{border-top:1px solid var(--line-strong);margin-top:6px;padding-top:12px;color:var(--text);font-family:var(--head);font-weight:800;font-size:1.25rem}
.price-note{margin-top:16px;font-size:14px;color:var(--text-3);max-width:46em}
.live{margin-top:20px}
.notes{margin-top:32px;padding:20px 24px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.notes h2{font-size:1rem;margin-bottom:6px}
.options{margin-top:56px}
.options > h2{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:20px}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.option{position:relative;display:block;padding:22px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);cursor:pointer}
.option input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.option:has(input:checked){border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.option:has(input:focus-visible){outline:2px solid var(--orange);outline-offset:3px}
.option h3{font-size:1.1rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:12px}
.option h3 small{font-family:var(--body);font-size:14px;font-weight:600;color:var(--orange);white-space:nowrap}
.option p{font-size:15px}
.approve{margin-top:28px;display:grid;gap:12px;max-width:640px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;color:var(--text);font:400 15px/1.4 var(--body);padding:11px 12px}
.field input:focus,.field textarea:focus{border-color:var(--orange)}
.field textarea{min-height:80px;resize:vertical}
.error{display:none;color:#ff8a7a;font-size:14px}
.sent{display:none;margin-top:28px;padding:22px;border:1px solid var(--orange);border-radius:12px}
.fine{font-size:13px;color:var(--text-3)}
.empty{padding-block:80px;max-width:36em}
.empty h1{font-size:2rem;margin-bottom:12px}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:14px;color:var(--text-3)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a{color:var(--text-3)}
@media (max-width:700px){
  .part{grid-template-columns:minmax(0,1fr) auto}
  .part-type{grid-column:1/-1}
  .part-sub{grid-column:1/-1}
  .option-grid,.row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="index.html"><img src="logo.png" alt="" width="36" height="36" /><span class="wordmark">Precision <span>PC</span></span></a><span class="nav-note">Build sheet</span></div></header>
<main class="wrap" id="app">
  <div class="empty" id="loading"><h1>Loading your build…</h1><p>If this doesn't change, the link may be incomplete. Ask us to resend it.</p></div>
</main>
<footer><div class="wrap"><span>Precision PC, Greenfield, Massachusetts</span><a href="faq.html#policies">Policies and privacy</a></div></footer>

<script>
/* Precision PC build sheet: shared encode/decode for build links.
   The whole parts list lives in the link after "#", so nothing is stored on a server. */
var PPC = (function () {
  function b64urlFromBytes(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function bytesFromB64url(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function pipe(bytes, stream) {
    var res = new Response(new Blob([bytes]).stream().pipeThrough(stream));
    return new Uint8Array(await res.arrayBuffer());
  }
  async function encode(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === 'function') {
      try { return 'z' + b64urlFromBytes(await pipe(bytes, new CompressionStream('deflate-raw'))); } catch (e) {}
    }
    return 'j' + b64urlFromBytes(bytes);
  }
  async function decode(str) {
    var kind = str.charAt(0), bytes = bytesFromB64url(str.slice(1));
    if (kind === 'z') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
    else if (kind !== 'j') throw new Error('Unknown link format');
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function money(n) {
    var v = Number(n);
    if (!isFinite(v)) return '';
    return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  /* Parse PCPartPicker exports: the Markdown (Reddit) table or the plain Text format. */
  function parsePcpp(text) {
    var out = { list: '', parts: [] };
    var listM = text.match(/https?:\/\/(?:[a-z]+\.)?pcpartpicker\.com\/(?:list|user\/[^\/\s]+\/saved)\/[A-Za-z0-9#\/_-]+/);
    if (listM) out.list = listM[0].replace(/[)\]]+$/, '');
    var priceRe = /\$\s?([\d,]+(?:\.\d{1,2})?)/;
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;
      // Markdown table row: **Type** | [Name](url) | $123.45 @ Store
      var md = line.match(/^\*\*(.+?)\*\*\s*\|\s*(.+?)\s*\|\s*(.*)$/);
      if (md) {
        var type = md[1].trim(), item = md[2].trim(), priceCell = md[3].trim();
        if (/^total$/i.test(type)) return;
        var link = item.match(/^\[(.+)\]\((https?:\/\/[^)\s]+)\)$/);
        var name = link ? link[1] : item.replace(/\*/g, '');
        var url = link ? link[2] : '';
        var pm = priceCell.match(priceRe), sm = priceCell.match(/@\s*(.+)$/);
        out.parts.push({ type: type, name: name, price: pm ? pm[1].replace(/,/g, '') : '', url: url, store: sm ? sm[1].replace(/\*/g, '').trim() : '' });
        return;
      }
      // Text format: Type: Name  ($123.45 @ Store)
      var tx = line.match(/^([A-Za-z][A-Za-z \/]+?):\s+(.+?)(?:\s+\((.*)\))?$/);
      if (tx && !/^(PCPartPicker Part List|Total|Generated by|Prices include|Custom Part List)/i.test(line)) {
        var info = tx[3] || '', p2 = info.match(priceRe), s2 = info.match(/@\s*(.+)$/);
        out.parts.push({ type: tx[1].trim(), name: tx[2].trim(), price: p2 ? p2[1].replace(/,/g, '') : '', url: '', store: s2 ? s2[1].trim() : '' });
      }
    });
    return out;
  }
  return { encode: encode, decode: decode, money: money, parsePcpp: parsePcpp };
})();

var WEB3FORMS_KEY='b2d3553d-df17-41ff-9ce2-e11c1f78308b';
var HANDLING_FEE=25;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){return /^https:\/\//i.test(u||'')?u:'';}
function render(d){
  var app=document.getElementById('app');
  var parts=d.parts||[], addons=d.addons||[];
  var partsTotal=parts.reduce(function(t,p){return t+(parseFloat(p.price)||0);},0);
  var labor=parseFloat(d.labor)||0;
  var addTotal=addons.reduce(function(t,a){return t+(parseFloat(a.price)||0);},0);
  var service=labor+addTotal;
  var rows=parts.map(function(p){
    var url=safeUrl(p.url), store=p.store?'Quoted at '+esc(p.store):'';
    var link=url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">See live prices</a>':'';
    var sub=[store,link].filter(Boolean).join(' · ');
    return '<div class="part"><div class="part-type">'+esc(p.type)+'</div><div class="part-name">'+esc(p.name)+'</div><div class="part-price">'+(p.price?PPC.money(p.price):'—')+'</div>'+(sub?'<div class="part-sub">'+sub+'</div>':'')+'</div>';
  }).join('');
  var addRows=addons.map(function(a){return '<div><span>'+esc(a.label)+'</span><span>'+PPC.money(a.price)+'</span></div>';}).join('');
  var list=safeUrl(d.list);
  app.innerHTML=
   '<div class="sheet-head"><div><h1>'+esc(d.title||'Your custom build')+'</h1><p class="meta">'+(d.name?'Prepared for '+esc(d.name)+' · ':'')+'Quoted '+esc(d.date||'')+'</p></div>'+
   (list?'<a class="btn btn-quiet" href="'+esc(list)+'" target="_blank" rel="noopener">Compare live prices</a>':'')+'</div>'+
   '<div class="parts">'+rows+'</div>'+
   '<div class="totals"><div><span>Parts, at quoted prices</span><span>'+PPC.money(partsTotal)+'</span></div>'+
   '<div><span>Build labor</span><span>'+PPC.money(labor)+'</span></div>'+addRows+
   '<div class="grand"><span>Estimated total</span><span>'+PPC.money(partsTotal+service)+'</span></div></div>'+
   '<p class="price-note">Part prices change daily, so the parts total is an estimate from the day we quoted it. Check live prices before ordering. Build labor is fixed, and add-ons are priced as listed. Every build includes stress testing and lifetime build support.</p>'+
   (d.notes?'<div class="notes"><h2>Notes from Ben</h2><p>'+esc(d.notes).replace(/\n/g,'<br>')+'</p></div>':'')+
   '<section class="options"><h2>How do you want to get the parts?</h2>'+
   '<form id="approve-form" novalidate><div class="option-grid">'+
   '<label class="option"><input type="radio" name="order" value="I\'ll order the parts myself" /><h3>Order them yourself <small>No fee</small></h3><p>Use the links above to buy each part in your name, shipped to you or to us. You pay us '+PPC.money(service)+' for labor and add-ons when we deliver the finished PC.</p></label>'+
   '<label class="option"><input type="radio" name="order" value="Order the parts for me" /><h3>We order them for you <small>+ '+PPC.money(HANDLING_FEE)+'</small></h3><p>We buy the exact parts at cost and hand you the receipts. Parts and the handling fee are paid by cash or bank transfer before we order, and aren\'t refundable once ordered. Labor is paid at delivery.</p></label>'+
   '</div><div class="approve"><div class="row"><div class="field"><label for="a-name">Your name</label><input id="a-name" autocomplete="name" /></div><div class="field"><label for="a-phone">Phone</label><input id="a-phone" type="tel" autocomplete="tel" /></div></div>'+
   '<div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" /></div>'+
   '<div class="field"><label for="a-msg">Changes or questions <small>(optional)</small></label><textarea id="a-msg"></textarea></div>'+
   '<div><button class="btn btn-primary" id="a-btn" type="submit">Approve this build</button></div><p class="error" id="a-err" role="alert"></p>'+
   '<p class="fine">Approving doesn\'t charge you anything. We\'ll confirm the final prices with you before any parts are ordered.</p></div></form>'+
   '<div class="sent" id="a-sent" role="status"><h3 id="a-sent-title" tabindex="-1">Build approved</h3><p>Thanks! We\'ll be in touch within 24 hours to confirm prices and next steps.</p></div></section>';
  document.title=(d.title||'Your custom build')+' | Precision PC';
  document.getElementById('approve-form').addEventListener('submit',function(e){e.preventDefault();approve(d,partsTotal,service);});
}
async function approve(d,partsTotal,service){
  var v=function(id){return document.getElementById(id).value.trim();};
  var err=document.getElementById('a-err'),btn=document.getElementById('a-btn');
  var show=function(m){err.textContent=m;err.style.display='block';};
  err.style.display='none';
  var pick=document.querySelector('input[name="order"]:checked');
  var name=v('a-name'),phone=v('a-phone'),email=v('a-email');
  if(!pick){show('Choose how you want to get the parts.');return;}
  if(!name||!phone||!email){show('Fill in your name, phone and email.');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){show('That email address doesn\'t look right. Check it and try again.');return;}
  if(phone.replace(/\D/g,'').length<10){show('Enter a 10-digit phone number, including area code.');return;}
  btn.disabled=true;btn.textContent='Sending…';
  try{
    var res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:'Build approved: '+(d.title||'custom build')+' ('+name+')',from_name:'Precision PC Website',
        name:name,phone:phone,email:email,parts_option:pick.value,build:d.title||'',quoted:d.date||'',
        parts_total_quoted:PPC.money(partsTotal),labor_and_addons:PPC.money(service),sheet_link:location.href,message:v('a-msg')||'(none)'})});
    var data=await res.json();
    if(data.success){document.getElementById('approve-form').style.display='none';document.getElementById('a-sent').style.display='block';document.getElementById('a-sent-title').focus();}
    else throw new Error(data.message||'failed');
  }catch(e){show('That didn\'t go through. Check your connection and try again, or email us at precisionpcma@gmail.com.');btn.disabled=false;btn.textContent='Approve this build';}
}
(async function(){
  var h=location.hash.slice(1);
  if(!h){document.getElementById('app').innerHTML='<div class="empty"><h1>No build here yet</h1><p>Build sheets are sent as a personal link. Want one? <a href="builds.html#plan">Plan your build</a> and we\'ll send yours.</p></div>';return;}
  try{render(await PPC.decode(h));}
  catch(e){document.getElementById('app').innerHTML='<div class="empty"><h1>This link didn\'t load</h1><p>It may have been cut off when it was copied. Ask us to resend it, or <a href="index.html#quote">send a request</a>.</p></div>';}
})();
</script>
</body>
</html>
